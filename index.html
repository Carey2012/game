<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话 · 双栏布局</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 左侧：配置面板 (1/3) -->
        <aside class="sidebar">
            <h2>⚙️ API 配置</h2>
            <div class="config-form">
                <label>名称 (可选)</label>
                <input type="text" id="configName" placeholder="例如: 翻译助手">

                <label>模型</label>
                <input type="text" id="modelName" placeholder="gpt-4 / claude-3.5 等">

                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">

                <label>代理地址 (完整 URL)</label>
                <input type="text" id="proxyUrl" placeholder="https://api.example.com/v1/chat/completions">

                <div class="button-group">
                    <button id="saveConfigBtn">💾 保存配置</button>
                    <button id="loadConfigBtn" class="secondary">📂 加载</button>
                </div>
                <p class="hint">配置仅保存在你的浏览器本地。</p>
            </div>
        </aside>

        <!-- 右侧：对话区域 (2/3) -->
        <main class="chat-area">
            <h2>💬 对话</h2>
            <div id="chatMessages" class="chat-messages">
                <div class="message system">在左侧填写 API 配置并保存，然后开始对话。</div>
            </div>
            <div class="chat-input-area">
                <textarea id="userInput" rows="2" placeholder="输入消息..."></textarea>
                <button id="sendBtn">🚀 发送</button>
            </div>
            <div id="status" class="status"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
