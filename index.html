<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 对话 · 多配置 · 深浅主题</title>
    <link rel="stylesheet" href="style.css">
    <!-- Markdown 解析 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 代码高亮 (可选) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
</head>
<body>
    <div class="app">
        <!-- 左侧：配置管理面板 -->
        <aside class="sidebar">
            <h2>⚙️ API 配置</h2>
            
            <!-- 配置列表 -->
            <div class="config-list-container">
                <label>已保存的配置</label>
                <ul id="configList" class="config-list"></ul>
                <p id="noConfigMsg" class="hint">暂无配置，请新增一个。</p>
            </div>

            <!-- 配置编辑表单 -->
            <div class="config-form">
                <label>名称</label>
                <input type="text" id="configName" placeholder="例如: 翻译助手">

                <label>模型</label>
                <input type="text" id="modelName" placeholder="gpt-4 / claude-3.5 等">

                <label>API Key</label>
                <input type="password" id="apiKey" placeholder="sk-...">

                <label>代理地址 (完整 URL)</label>
                <input type="text" id="proxyUrl" placeholder="https://api.example.com/v1/chat/completions">

                <div class="button-group">
                    <button id="saveNewConfigBtn">➕ 新增</button>
                    <button id="updateConfigBtn" class="secondary">✏️ 更新</button>
                </div>
                <p class="hint">配置保存在浏览器本地。点击列表项可切换激活。</p>
            </div>
        </aside>

        <!-- 右侧：对话区域 -->
        <main class="chat-area">
            <h2 style="display: flex; justify-content: space-between; align-items: center;">
                <span>💬 对话</span>
                <div style="display: flex; gap: 0.5rem;">
                    <button id="themeToggleBtn" style="width: auto; padding: 0.3rem 0.8rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-primary);">🌙 深色</button>
                    <button id="clearChatBtn" style="width: auto; padding: 0.3rem 1rem; background: var(--button-secondary-bg); color: var(--button-secondary-text);">🗑️ 清空</button>
                </div>
            </h2>
            <div id="chatMessages" class="chat-messages">
                <div class="message system">在左侧选择或新增 API 配置，然后开始对话。</div>
            </div>
            <div class="chat-input-area">
                <textarea id="userInput" rows="2" placeholder="输入消息..."></textarea>
                <button id="sendBtn">🚀 发送</button>
            </div>
            <div id="status" class="status"></div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
